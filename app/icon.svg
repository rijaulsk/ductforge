<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!--
    GENERATED SHAPE — the elbow below is scripts/mark.mjs. Change it there, run
    `npm run brand`, and paste the same path here, or the tab icon and the logo
    stop being the same symbol. They did once.

    A square-backed elbow: mitred heel, radiused throat. A fully radiused bend
    is a curve, and a curve is the most generic mark there is; what separates
    duct from pipe is that duct is rectangular, and a rectangular bend miters
    on the outside while it sweeps on the inside. Indigo 500 ground, Cream
    mark, both from the token table.
  -->
